name: verified-commits

# Every commit in a pull request must carry a signature GitHub verifies.
# Required on every repository's default branch by the organization ruleset
# "signed-and-verified-commits". Branch protection's "require signed commits"
# only sees the commit that lands on main, and a squash merge is signed by
# GitHub whatever the pull request held; this check reads each commit.
#
# When a commit is not verified the check fails and also tells the author on
# the pull request itself: one comment that names each commit, the reason and
# the fix, and the label `needs-signed-commits`. When every commit is verified
# the comment is updated to say so and the label is removed.
#
# pull_request_target runs this file as it is on main, with a token that can
# comment, and without waiting for a maintainer to approve a first-time
# contributor's workflow runs. The pull request's code is never checked out,
# built or run: the check reads commit metadata from the API.
#
# Fix a refusal: set up commit signing once
#   https://docs.github.com/en/authentication/managing-commit-signature-verification
# then re-sign the branch and push it again:
#   git rebase --exec 'git commit --amend --no-edit -S' origin/main
#   git push --force-with-lease

on:
  pull_request_target:
  merge_group:

permissions:
  contents: read
  pull-requests: write   # the comment and the label on the pull request
  issues: write          # creating the label the first time it is used

concurrency:
  group: verified-commits-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  verified-commits:
    name: every commit is signed and verified
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the verification of every commit in the pull request
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          MARK='<!-- verified-commits -->'
          LABEL='needs-signed-commits'
          GUIDE='https://github.com/USAREUR-AF/goatcore/blob/main/CONTRIBUTING.md#commits'

          # Only the commit id, the verdict and GitHub's reason are used. Names
          # and messages are the author's text and are never printed or posted.
          gh api --paginate "repos/${REPO}/pulls/${PR}/commits?per_page=100" \
            -q '.[] | [.sha[0:12], (.commit.verification.verified|tostring), .commit.verification.reason] | @tsv' \
            > commits.tsv
          total=$(wc -l < commits.tsv | tr -d ' ')
          bad=$(awk -F'\t' '$2 != "true"' commits.tsv | wc -l | tr -d ' ')

          comment_id=$(gh api --paginate "repos/${REPO}/issues/${PR}/comments?per_page=100" \
            -q ".[] | select(.body | startswith(\"${MARK}\")) | .id" | head -n 1 || true)

          # Telling the author must never change the verdict: a token that
          # cannot write (a Dependabot pull request) still gets the check.
          post() {
            if [ -n "${comment_id}" ]; then
              gh api -X PATCH "repos/${REPO}/issues/comments/${comment_id}" -F body=@comment.md >/dev/null \
                || echo "::warning::could not update the comment on the pull request"
            else
              gh api -X POST "repos/${REPO}/issues/${PR}/comments" -F body=@comment.md >/dev/null \
                || echo "::warning::could not comment on the pull request"
            fi
          }

          if [ "${bad}" -gt 0 ]; then
            {
              echo "${MARK}"
              echo "@${PR_AUTHOR}, this pull request cannot merge yet: ${bad} of its ${total} commit(s) do not carry a signature GitHub verifies. Every commit in a pull request must be signed and verified ([contributor guide](${GUIDE}))."
              echo
              echo "| Commit | GitHub's reason |"
              echo "|---|---|"
              awk -F'\t' '$2 != "true" {printf "| `%s` | `%s` |\n", $1, $3}' commits.tsv
              echo
              echo "What each reason means:"
              echo
              echo "- \`unsigned\`: the commit has no signature."
              echo "- \`unknown_key\`: the commit is signed, but the key is not registered on your GitHub account as a *signing* key."
              echo "- \`no_user\`, \`unverified_email\`, \`bad_email\`: the commit's email is not a verified email on your GitHub account."
              echo
              echo "To fix it:"
              echo
              echo "1. Set up commit signing once: [GitHub's guide](https://docs.github.com/en/authentication/managing-commit-signature-verification). Register the key on your account as a signing key."
              echo "2. Re-sign the commits on this branch and push again:"
              echo
              echo '   ```'
              echo "   git rebase --exec 'git commit --amend --no-edit -S' origin/main"
              echo '   git push --force-with-lease'
              echo '   ```'
              echo
              echo "This comment updates by itself when you push."
            } > comment.md
            post
            gh api -X POST "repos/${REPO}/issues/${PR}/labels" -f "labels[]=${LABEL}" >/dev/null \
              || echo "::warning::could not add the label ${LABEL}"

            echo "::error::Commits in this pull request that GitHub does not verify:"
            awk -F'\t' '$2 != "true" {printf "  %s  reason=%s\n", $1, $3}' commits.tsv
            cat <<'MSG'

          Every commit must carry a signature GitHub verifies (reason=valid).
            unsigned     the commit has no signature: sign it
            unknown_key  the signing key is not registered on the author's GitHub
                         account as a *signing* key: add it there
            no_user      the commit email is not a verified email on any account

          Re-sign the branch and push it again:
            git rebase --exec 'git commit --amend --no-edit -S' origin/main
            git push --force-with-lease
          MSG
            exit 1
          fi

          if [ -n "${comment_id}" ]; then
            printf '%s\nAll %s commit(s) in this pull request are now signed and verified. Thank you.\n' "${MARK}" "${total}" > comment.md
            post
          fi
          gh api -X DELETE "repos/${REPO}/issues/${PR}/labels/${LABEL}" >/dev/null 2>&1 || true
          echo "OK: all ${total} commit(s) are signed and verified."
      - name: Merge queue
        if: github.event_name == 'merge_group'
        run: echo "Merge queue commits are created and signed by GitHub."
