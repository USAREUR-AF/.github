blank_issues_enabled: false
contact_links:
  - name: Security report
    url: https://github.com/USAREUR-AF/goatcore/security/policy
    about: >-
      Never open a public issue for a security problem. Use the Security tab of the
      repository you are reporting against and choose "Report a vulnerability".
  - name: Question or idea
    url: https://github.com/USAREUR-AF/goatcore/discussions
    about: >-
      Ask questions and discuss ideas in goatcore's Discussions. Come back with an
      issue once there is something concrete to fix or build.
